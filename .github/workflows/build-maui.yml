name: Build MAUI App

on:
  workflow_dispatch:
  push:
    branches:
      - Development

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet workload restore Yoton-Mobile.csproj

      - name: Get app version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<ApplicationDisplayVersion>).*?(?=</ApplicationDisplayVersion>)' Yoton-Mobile.csproj)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > yoton-release.keystore

      - name: Publish APK
        env:
          AndroidSigningKeyStore: ${{ github.workspace }}/yoton-release.keystore
          AndroidSigningKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          AndroidSigningKeyPass: ${{ secrets.ANDROID_KEY_PASSWORD }}
          AndroidSigningStorePass: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: >
          dotnet publish Yoton-Mobile.csproj
          -f net10.0-android
          -c Release
          -p:AndroidPackageFormat=apk

      - name: Rename APK
        run: |
          mkdir -p out
          cp bin/Release/net10.0-android/*-Signed.apk out/Yoton-Mobile.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: out/Yoton-Mobile.apk

  release:
    runs-on: ubuntu-latest
    needs: build-android
    permissions:
      contents: write
    outputs:
      download_url: ${{ steps.publish.outputs.download_url }}
      release_date: ${{ steps.publish.outputs.release_date }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: apk

      - name: Replace previous latest release
        run: |
          gh release delete development-latest --repo "${{ github.repository }}" --yes --cleanup-tag || true

      - name: Publish latest release
        id: publish
        run: |
          RELEASE_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          gh release create development-latest apk/Yoton-Mobile.apk \
            --repo "${{ github.repository }}" \
            --title "Yoton v${{ needs.build-android.outputs.version }}" \
            --notes "Latest automated build from the Development branch." \
            --latest

          DOWNLOAD_URL=$(gh api "repos/${{ github.repository }}/releases/tags/development-latest" --jq '.assets[0].browser_download_url')

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "::error::Could not resolve APK download URL from release assets"
            exit 1
          fi

          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
          echo "release_date=$RELEASE_DATE" >> "$GITHUB_OUTPUT"

  notify:
    runs-on: ubuntu-latest
    needs: [build-android, release]
    steps:
      - name: Notify Discord
        env:
          VERSION: ${{ needs.build-android.outputs.version }}
          DOWNLOAD_URL: ${{ needs.release.outputs.download_url }}
          RELEASE_DATE: ${{ needs.release.outputs.release_date }}
          ACTOR: ${{ github.actor }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Manual workflow run' }}
        run: |
          if [ -z "${{ secrets.DISCORD_WEBHOOK }}" ]; then
            echo "::error::DISCORD_WEBHOOK secret is not set"
            exit 1
          fi

          echo "Download URL: $DOWNLOAD_URL"
          COMMIT_MSG_ESCAPED=$(echo "$COMMIT_MESSAGE" | head -c 500 | jq -Rs .)

          HTTP_CODE=$(curl -sS -o response_body.txt -w "%{http_code}" \
          -H "Content-Type: application/json" \
          -X POST \
          -d "{
            \"content\": \"**📦 New Yoton Development Build**\",
            \"embeds\": [{
              \"title\": \"Yoton v${VERSION}\",
              \"description\": \"**[⬇️ Click here to download the APK](${DOWNLOAD_URL})**\",
              \"color\": 5814783,
              \"fields\": [
                {\"name\": \"Version\", \"value\": \"${VERSION}\", \"inline\": true},
                {\"name\": \"Release Date\", \"value\": \"${RELEASE_DATE}\", \"inline\": true},
                {\"name\": \"Generated By\", \"value\": \"${ACTOR}\", \"inline\": true},
                {\"name\": \"Commit Message\", \"value\": ${COMMIT_MSG_ESCAPED}, \"inline\": false}
              ],
              \"footer\": {\"text\": \"Yoton Mobile CI · Development branch\"}
            }]
          }" \
          "${{ secrets.DISCORD_WEBHOOK }}?wait=true")

          echo "Discord response code: $HTTP_CODE"
          cat response_body.txt

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Discord webhook call failed with status $HTTP_CODE"
            exit 1
          fi
