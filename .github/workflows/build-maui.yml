name: Build MAUI App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore workloads
        run: dotnet workload restore Yoton-Mobile.csproj

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > yoton-release.keystore

      - name: Publish signed Android AAB (Play Store)
        env:
          SIGN_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGN_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGN_STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: >
          dotnet publish Yoton-Mobile.csproj
          -f net10.0-android
          -c Release
          -p:AndroidPackageFormat=aab
          -p:AndroidSigningKeyStore="${{ github.workspace }}/yoton-release.keystore"
          -p:AndroidSigningKeyAlias="$SIGN_ALIAS"
          -p:AndroidSigningKeyPass="$SIGN_KEY_PASS"
          -p:AndroidSigningStorePass="$SIGN_STORE_PASS"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: bin/Release/net10.0-android/*-Signed.aab

      - name: Publish signed Android APK (sideload/testing)
        env:
          SIGN_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGN_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGN_STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: >
          dotnet publish Yoton-Mobile.csproj
          -f net10.0-android
          -c Release
          -p:AndroidPackageFormat=apk
          -p:AndroidSigningKeyStore="${{ github.workspace }}/yoton-release.keystore"
          -p:AndroidSigningKeyAlias="$SIGN_ALIAS"
          -p:AndroidSigningKeyPass="$SIGN_KEY_PASS"
          -p:AndroidSigningStorePass="$SIGN_STORE_PASS"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: bin/Release/net10.0-android/*-Signed.apk

  # iOS and MacCatalyst jobs are intentionally omitted: producing a real
  # installable/signed build for either requires enrolling in the Apple
  # Developer Program ($99/yr) plus a signing certificate and provisioning
  # profile. Add them back (see git history / ask for the snippet) once
  # that's in place.

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore workloads
        run: dotnet workload restore Yoton-Mobile.csproj

      - name: Publish Windows (unpackaged)
        run: >
          dotnet publish Yoton-Mobile.csproj
          -f net10.0-windows10.0.19041.0
          -c Release
          -p:RuntimeIdentifierOverride=win10-x64

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: bin/Release/net10.0-windows10.0.19041.0/win10-x64/publish/**
