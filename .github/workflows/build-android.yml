name: Build Android

# Runs the checks on every push/PR; produces signed release artifacts on version tags (v*) or by
# hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  build-android:
    # Only tagged releases / manual runs build the signed artifacts.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npm ci

      # The native project isn't checked in: it's generated from app.json (+ plugins/) each build.
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/yoton-release.keystore"

      # plugins/withReleaseSigning.js wires these variables into the release signing config.
      - name: Build signed AAB (Play Store) and APK (sideload/testing)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/yoton-release.keystore
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/*.apk

  # iOS is intentionally omitted: producing an installable/signed build requires enrolling in the
  # Apple Developer Program ($99/yr) plus a signing certificate and provisioning profile. Build on
  # a Mac with Xcode, or add an EAS Build job (`eas build --platform ios`) once that's in place.
